name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test mount recognition and media verification
        run: swift scripts/test.swift
      - name: Build application
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-NAS-Mount-macOS-arm64
          path: dist/WeChat-NAS-Mount-macOS-arm64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/WeChat-NAS-Mount-macOS-arm64.zip
          --title "${GITHUB_REF_NAME} — 简洁菜单栏图标"
          --notes "将 NAS 文字和状态圆点替换为 macOS 原生单色机架图标，异常时显示警告，悬停查看连接状态。保留登录自动连接、唤醒检查和媒体验证。临时签名升级后可能需要刷新完全磁盘访问权限。"
          --generate-notes
