name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test mount recognition and media verification
        run: swift scripts/test.swift
      - name: Build application
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-NAS-Mount-macOS-arm64
          path: dist/WeChat-NAS-Mount-macOS-arm64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/WeChat-NAS-Mount-macOS-arm64.zip
          --title "${GITHUB_REF_NAME} — 存储桥接图标"
          --notes "采用已确认的自定义存储桥接图标：两个存储端通过圆润连接线桥接，18 pt 原生矢量绘制，自动适配菜单栏深浅颜色。异常时保留警告图标。保留登录自动连接、唤醒检查及媒体验证。临时签名升级后可能需要刷新完全磁盘访问权限。"
          --generate-notes
