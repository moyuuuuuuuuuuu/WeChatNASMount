name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-NAS-Mount-macOS-arm64
          path: dist/WeChat-NAS-Mount-macOS-arm64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/WeChat-NAS-Mount-macOS-arm64.zip --generate-notes
